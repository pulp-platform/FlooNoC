[project]
name = "floogen"
version = "0.8.4"
description = "A Network Generator for FlooNoC"
readme = "docs/floogen/overview.md"
license = "Apache-2.0"
license-files = ["LICENSE-APACHE"]
requires-python = ">=3.10"
authors = [{ name = "Tim Fischer", email = "fischeti@iis.ee.ethz.ch" }]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
  "Development Status :: 4 - Beta",
]
keywords = ["noc", "network-on-chip", "generator", "systemverilog", "eda", "pulp-platform"]

dependencies = [
  "pydantic",
  "networkx",
  "mako",
  "ruamel.yaml",
]

[project.optional-dependencies]
viz = ["matplotlib"]

[project.urls]
Homepage = "https://github.com/pulp-platform/FlooNoC"
Repository = "https://github.com/pulp-platform/FlooNoC"
Documentation = "https://pulp-platform.github.io/FlooNoC/"
Changelog = "https://github.com/pulp-platform/FlooNoC/blob/main/CHANGELOG.md"

[project.scripts]
floogen = "floogen.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
    "jsonschema",
    "mkdocstrings-python>=2.0.1",
    "zensical",
    "reuse[charset-normalizer]>=6.2.0",
    "prek>=0.4.11",
    "typos>=1.48.0",
]

[build-system]
requires = ["uv_build>=0.9.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "floogen"
module-root = ""
wheel-exclude = ["floogen/tests/**"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["floogen/tests"]

[tool.ruff]
line-length = 100

[tool.ty.terminal]
error-on-warning = true

[tool.ty.src]
# `util/` holds standalone helper scripts with their own optional dependencies
# (e.g. pygame) that are not part of the distributed package.
include = ["floogen"]
