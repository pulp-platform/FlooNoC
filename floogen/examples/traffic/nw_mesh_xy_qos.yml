traffic_flows:
  - name: "cl_0_0_to_hbm_0_0"
    initiator: [0, 0]
    endpoint: [-1, 0]
    rw: write
    start_time: 0
    qos: 0
    narrow_burst:
      number: 2
      length: 16
    wide_burst:
      number: 4
      length: 64
  - name: "cl_0_2_from_cl_3_1"
    initiator: [0, 2]
    endpoint: [3, 1]
    rw: read
    start_time: 50
    qos: 1
    narrow_burst:
      number: 0
      length: 1
    wide_burst:
      number: 2
      length: 32
  - name: "cl_1_1_from_cl_2_2"
    initiator: [1, 1]
    endpoint: [2, 2]
    rw: read
    start_time: 200
    qos: 5
    narrow_burst:
      number: 2
      length: 8
    wide_burst:
      number: 2
      length: 64
  - name: "cl_2_0_to_cl_0_3"
    initiator: [2, 0]
    endpoint: [0, 3]
    rw: write
    start_time: 500
    qos: 10
    narrow_burst:
      number: 1
      length: 32
    wide_burst:
      number: 3
      length: 16
  - name: "cl_1_3_to_cl_3_0"
    initiator: [1, 3]
    endpoint: [3, 0]
    rw: write
    start_time: 2000
    qos: 7
    narrow_burst:
      number: 4
      length: 4
    wide_burst:
      number: 0
      length: 1
  - name: "cl_3_3_from_hbm_0_3"
    initiator: [3, 3]
    endpoint: [-1, 3]
    rw: read
    start_time: 1000
    qos: 15
    narrow_burst:
      number: 1
      length: 1
    wide_burst:
      number: 2
      length: 256
